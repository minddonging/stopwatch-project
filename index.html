<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JavaScript Stopwatch Project</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>

<body>
  <main class="container">
    <section class="card">
      <p class="course">WST154 JavaScript</p>
      <h1>Stop Watch</h1>
      <p class="description">
        This stopwatch updates every second using JavaScript setInterval().
      </p>

      <div id="display">0</div>
      <div class="calendar-box">
      <h2>Calendar</h2>

      <p id="time"></p>

      <p id="date"></p>
      </div>

      <div class="buttons">
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
        <button id="resetBtn">Reset</button>
      </div>

      <p class="note">Click Start to begin, Stop to pause, and Reset to clear the timer.</p>
    </section>
  </main>
</body>
</html>
