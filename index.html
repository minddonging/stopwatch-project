<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendar & Stopwatch</title>

  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>

<body>

  <main class="container">

    <section class="card">

      <p class="course">WST154 JavaScript</p>

      <h1>Calendar & Stopwatch</h1>

      <!-- Calendar -->
      <div class="calendar-box">

        <h2>Calendar</h2>

        <p id="time">Time:</p>

        <p id="date">Date:</p>

      </div>

      <!-- Stopwatch -->
      <div class="stopwatch-box">

        <h2>Stop Watch</h2>

        <div id="display">0</div>

        <div class="buttons">

          <button id="startBtn">Start</button>

          <button id="stopBtn">Stop</button>

          <button id="resetBtn">Reset</button>

        </div>

        <p class="note">
          Click Start to begin, Stop to pause, and Reset to clear the timer.
        </p>

      </div>

    </section>

  </main>

</body>
</html>
